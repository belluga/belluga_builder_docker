# Runner-only overrides for a private, disposable rehearsal.
services:
  builder-ingress:
    ports: !override
      - target: 80
        host_ip: 127.0.0.1
      - target: 443
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ${BUILDER_SMOKE_CADDYFILE:?set the generated Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false

  builder-viewer:
    image: ${BUILDER_SMOKE_VIEWER_IMAGE:?set the Viewer image under test}
  builder-registry:
    image: ${BUILDER_SMOKE_REGISTRY_IMAGE:?set the Registry image under test}
    networks: [fixture-mongo]
  project-reader:
    image: ${BUILDER_SMOKE_READER_IMAGE:?set the Reader image under test}
  builder-mcp:
    image: ${BUILDER_SMOKE_MCP_IMAGE:?set the MCP image under test}
  registry-migrate:
    image: ${BUILDER_SMOKE_REGISTRY_IMAGE:?set the Registry image under test}
    networks: [fixture-mongo]

  mongo:
    image: mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    command: [--replSet, rs0, --bind_ip_all]
    networks: [fixture-mongo]

networks:
  fixture-mongo:
    internal: true
